<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Portal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #1a3d63;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #1a3d63; }
        p { color: #555; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Redirecting...</h2>
        <p id="message">Checking active session schedule...</p>
    </div>

    <script>
        // Set your time windows in IST (+05:30)
        // Format: YYYY-MM-DDTHH:MM:SS+05:30 (24-hour clock)
        const schedule = [
            {
                name: "Link 1",
                start: new Date("2026-11-12T17:30:00+05:30"),
                end:   new Date("2026-11-12T19:30:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSctg5-wnFRjf609EdMRvfR8h8Y_BX1DKA-vVTzxqd6C0NN1Nw/viewform?usp=pp_url&entry.tracking=qr_scan"
            },
            {
                name: "Link 2",
                start: new Date("2026-11-12T19:30:01+05:30"),
                end:   new Date("2026-11-12T22:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSezeo1PnFGLUqzTJM7NYob0H9QxcLQ_A2hApa6AhMPAq_uc3A/viewform?usp=publish-editor"
            }
        ];

        const now = new Date();
        let targetUrl = null;

        for (const slot of schedule) {
            if (now >= slot.start && now <= slot.end) {
                targetUrl = slot.url;
                break;
            }
        }

        if (targetUrl) {
            // Instantly forward to the active Google Form
            window.location.replace(targetUrl);
        } else {
            // If scanned before start time or after end time, show closed message
            document.getElementById("title").innerText = "Link Currently Inactive";
            document.getElementById("message").innerText = 
                "This form is only open during scheduled hours. Please scan again during the active session time.";
        }
    </script>
</body>
</html>
