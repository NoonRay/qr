<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Portal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #1a3d63;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #1a3d63; }
        p { color: #555; line-height: 1.5; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Redirecting...</h2>
        <p id="message">Checking active session schedule...</p>
    </div>

    <script>
        // Set your time windows in IST (+05:30)
        // Format: YYYY-MM-DDTHH:MM:SS+05:30 (24-hour clock)
        // You can add unlimited entries below separated by commas
        const schedule = [
            {
                name: "Link 1",
                start: new Date("2026-11-16T10:00:00+05:30"),
                end:   new Date("2026-11-17T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLScw6dHiGTAX3u6_iKIN39NDZb3skukEZ5h1tVhMlQgrppbPjQ/viewform?usp=publish-editor"
            },
            {
                name: "Link 2",
                start: new Date("2026-11-17T10:00:01+05:30"),
                end:   new Date("2026-11-18T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSc0JbrcbS-1cX6W0Lmy8jCwHACibrU8mCNiUDcF5kDUhhCKig/viewform?usp=publish-editor"
            },
            {
                name: "Link 3",
                start: new Date("2026-11-18T10:00:00+05:30"),
                end:   new Date("2026-11-19T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSdy5Xaq3yPZQY4eLBieG26_8Fn5tLvJ6xe0BYvzbkyW8dwUiQ/viewform?usp=publish-editor"
            },
            {
                name: "Link 4",
                start: new Date("2026-11-19T10:00:00+05:30"),
                end:   new Date("2026-11-20T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSctEteXo_JnFmRDtvVFG6iu1EffsL6qw9MRgJKsinWbwq8ZoA/viewform?usp=publish-editor"
            },
            {
                name: "Link 5",
                start: new Date("2026-11-20T10:00:00+05:30"),
                end:   new Date("2026-11-21T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSfvuM1EnLA1q8Ct0nh-sw3KOWNfoPj87m3zJsSYjrH3MzYpEQ/viewform?usp=publish-editor"
            },
            {
                name: "Link 6",
                start: new Date("2026-11-21T10:00:00+05:30"),
                end:   new Date("2026-11-22T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSejq7puY5mpEbHVk6c6qh2boBnZW5wunKuIgMn4LQQ2D0u_Qg/viewform?usp=publish-editor"
            },
            {
                name: "Link 6",
                start: new Date("2026-11-23T10:00:00+05:30"),
                end:   new Date("2026-11-24T10:00:00+05:30"),
                url:   "https://docs.google.com/forms/d/e/1FAIpQLSdDNJKrw--CEMYPsuaD8JnRHyITzJ5Od7ucm3FgrkKIl4-t0Q/viewform?usp=publish-editor"
            }
            
        ];

        async function routeByServerTime() {
            let now;
            try {
                // Fetch server header with cache-buster (?t=...) for tamper-proof IST time & high-traffic support
                const response = await fetch(window.location.pathname + "?t=" + Date.now(), {
                    method: "HEAD",
                    cache: "no-store"
                });
                const serverDateStr = response.headers.get("Date");
                now = serverDateStr ? new Date(serverDateStr) : new Date();
            } catch (error) {
                // Fallback if testing locally via file:// or if connection drops
                now = new Date();
            }

            let targetUrl = null;

            for (const slot of schedule) {
                if (now >= slot.start && now <= slot.end) {
                    targetUrl = slot.url;
                    break;
                }
            }

            if (targetUrl) {
                // Instantly forward to the active Google Form
                window.location.replace(targetUrl);
            } else {
                // If scanned before start time or after end time, show closed message
                document.getElementById("title").innerText = "Link Currently Inactive";
                document.getElementById("message").innerText = 
                    "This form is only open during scheduled hours. Please scan again during the active session time.";
            }
        }

        routeByServerTime();
    </script>
</body>
</html>
